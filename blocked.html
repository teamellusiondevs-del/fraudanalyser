
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Site Blocked - Fraud Blocker</title>
<style>
body { margin:0; font-family:Inter, sans-serif; background:#0a0a0a; color:white; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.card { background:#1a1a1a; border:1px solid #333; border-radius:20px; padding:40px; max-width:520px; text-align:center; box-shadow:0 20px 60px rgba(255,59,48,0.3); }
.icon { font-size:70px; }
h1 { color:#FF3B30; margin:15px 0 5px; }
h2 { font-size:14px; color:#888; font-weight:normal; word-break:break-all; }
.details { background:#222; padding:15px; border-radius:12px; margin:20px 0; text-align:left; font-size:13px; color:#ccc; line-height:1.5; }
button { padding:12px 20px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; margin:5px; }
.primary { background:white; color:black; }
.danger { background:#FF3B30; color:white; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚫</div>
  <h1 id="reason">Scam Blocked!</h1>
  <h2 id="url"></h2>
  <div class="details" id="details"></div>
  <p style="font-size:12px; color:#666;">Fraud Blocker Extension ne is site ko aapki safety ke liye block kiya hai.</p>
  <button class="primary" onclick="history.back()">⬅️ Go Back Safe</button>
  <button class="danger" id="proceed">⚠️ Fir bhi jana hai (Risky)</button>
  <p style="margin-top:15px; font-size:11px; color:#555;">Blocked by Fraud Blocker - Payment Scam Shield</p>
</div>
<script>
const params = new URLSearchParams(location.search);
document.getElementById("reason").innerText = params.get("reason") || "Scam Detected";
document.getElementById("url").innerText = params.get("url") || "";
document.getElementById("details").innerText = params.get("details") || "Ye site unsafe hai.";

document.getElementById("proceed").onclick = () => {
  if(confirm("Pakka jana hai? Ye site scam ho sakti hai!")) {
    const target = params.get("url");
    if(target) location.href = target;
  }
};
</script>
</body>
</html>
